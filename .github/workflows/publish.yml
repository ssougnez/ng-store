name: Publish to npm

# Branche au format X.Y.Z (ex: 2.0.0)  -> publie une préversion X.Y.Z-beta.N (dist-tag "beta")
# Tag git au format vX.Y.Z (ex: v2.0.0) -> publie la version stable X.Y.Z (dist-tag "latest")
# Note: les filtres GitHub sont du glob (pas du regex), d'où "[0-9]*" et non "[0-9]+".
on:
  push:
    branches:
      - '[0-9]*.[0-9]*.[0-9]*'
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

# Évite deux publications concurrentes sur la même ref.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # requis pour le Trusted Publishing npm (OIDC) + provenance auto

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pas de registry-url ici : il écrirait un .npmrc avec un _authToken vide qui
      # empêche npm de basculer sur l'OIDC (Trusted Publishing). Le registre par
      # défaut est déjà https://registry.npmjs.org.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Le Trusted Publishing (OIDC) exige npm >= 11.5.1 ; on force la dernière version.
      - name: Use latest npm
        run: |
          npm install -g npm@latest
          echo "npm: $(npm --version)"
          echo "node: $(node --version)"
          echo "which npm: $(which npm)"

      - name: Install dependencies
        run: npm ci

      - name: Resolve version and dist-tag
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Release stable : on retire le préfixe "v" du tag.
            VERSION="${GITHUB_REF_NAME#v}"
            DIST_TAG="latest"
          else
            # Préversion : on incrémente la plus haute beta existante sur npm.
            BASE="${GITHUB_REF_NAME}"
            # Si le package n'existe pas encore, npm view sort en erreur (et écrit
            # un objet d'erreur JSON sur stdout) : dans ce cas on repart d'une liste vide.
            if ! VERSIONS=$(npm view @areaprog/ng-store versions --json 2>/dev/null); then
              VERSIONS='[]'
            fi
            NEXT=$(node -e '
              const base = process.argv[1];
              let v;
              try { v = JSON.parse(process.argv[2] || "[]"); } catch (e) { v = []; }
              if (typeof v === "string") v = [v]; // npm renvoie une string si une seule version
              if (!Array.isArray(v)) v = [];      // objet d erreur ou autre -> ignore
              const prefix = base + "-beta.";
              let max = -1;
              for (const ver of v) {
                if (typeof ver === "string" && ver.startsWith(prefix)) {
                  const rest = ver.slice(prefix.length);
                  if (/^[0-9]+$/.test(rest)) max = Math.max(max, parseInt(rest, 10));
                }
              }
              process.stdout.write(String(max + 1));
            ' "$BASE" "$VERSIONS")
            VERSION="${BASE}-beta.${NEXT}"
            DIST_TAG="beta"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Publish::@areaprog/ng-store@${VERSION} (dist-tag: ${DIST_TAG})"

      - name: Build library
        run: npm run build:lib

      - name: Set published version
        run: |
          cd dist/ng-store
          npm version "${{ steps.meta.outputs.version }}" --no-git-tag-version --allow-same-version

      # Publication via Trusted Publishing (OIDC) : aucun token requis.
      # NB: en pratique npm ne déclenche l'échange OIDC que si --provenance est
      # passé explicitement (sinon -> ENEEDAUTH), même si la doc dit l'inverse.
      - name: Publish to npm
        run: |
          echo "npm at publish: $(npm --version)"
          echo "OIDC request url present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          cd dist/ng-store
          npm publish --provenance --access public --tag "${{ steps.meta.outputs.dist_tag }}"
