<main class="main">
  <div class="container">
    <h1>{{ title() }}</h1>
    <p>Demo of &#64;areaprog/ng-store with loadEntities</p>

    <div class="layout">
      <!-- Authors Panel -->
      <app-authors-list (authorSelected)="onAuthorSelected($event)" />

      <!-- Books Panel -->
      @if (selectedAuthorId(); as authorId) {
        <app-books-list [authorId]="authorId" />
      } @else {
        <section class="panel books-panel">
          <h2>Books</h2>
          <p class="empty">Select an author to see their books.</p>
        </section>
      }
    </div>
  </div>
</main>

<router-outlet />
