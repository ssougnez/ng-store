<main class="main">
  <div class="container">
    <h1>{{ title() }}</h1>
    <p>Demo of &#64;areaprog/ng-store with loadEntities</p>

    <div class="layout">
      <!-- Authors Panel -->
      <app-authors-list (authorSelected)="onAuthorSelected($event)" />

      <!-- Author Details Panel -->
      @if (selectedAuthorId(); as authorId) {
        <div class="author-details">
          <app-author-biography [authorId]="authorId" />
          <app-books-list [authorId]="authorId" />
        </div>
      } @else {
        <section class="panel books-panel">
          <h2>Author Details</h2>
          <p class="empty">Select an author to see their biography and books.</p>
        </section>
      }
    </div>
  </div>
</main>

<router-outlet />
