<section class="panel queries-panel">
  <h2>Executing Queries</h2>

  @if (hasQueries()) {
    <ul class="query-list">
      @for (query of executingGetQueries(); track query) {
        <li class="query-item">
          <span class="spinner"></span>
          <span class="badge badge-get">GET</span>
          <code>{{ query }}</code>
        </li>
      }
      @for (query of executingDeleteQueries(); track query) {
        <li class="query-item">
          <span class="spinner"></span>
          <span class="badge badge-delete">DELETE</span>
          <code>{{ query }}</code>
        </li>
      }
    </ul>
  } @else {
    <p class="empty">No queries currently executing.</p>
  }
</section>
