<div class="add-author">
  <button class="toggle-btn"
          (click)="toggleForm()">
    {{ showForm() ? 'Cancel' : '+ Add Author' }}
  </button>

  @if (showForm()) {
    <form class="author-form"
          (ngSubmit)="submit()">
      <div class="form-group">
        <label for="name">Name</label>
        <input id="name"
               type="text"
               [ngModel]="name()"
               (ngModelChange)="name.set($event)"
               name="name"
               placeholder="Author name"
               required />
      </div>

      <div class="form-group">
        <label for="country">Country</label>
        <input id="country"
               type="text"
               [ngModel]="country()"
               (ngModelChange)="country.set($event)"
               name="country"
               placeholder="Country"
               required />
      </div>

      <button type="submit"
              class="submit-btn"
              [disabled]="addAction.processing() || !name() || !country()">
        {{ addAction.processing() ? 'Adding...' : 'Add Author' }}
      </button>
    </form>
  }
</div>
